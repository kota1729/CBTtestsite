<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学習サイト</title>
    <link rel="stylesheet" href="./shared/style.css">
</head>

<body class="auth-mode">
    <main class="wrap">
        <section class="card hidden" id="loginPanel">
            <h1 class="auth-title" style="margin-bottom:22px">ログイン</h1>
            <div class="auth-form">
                <input id="userIdInput" type="text" autocomplete="off" required placeholder="ユーザーID">
                <div class="password-wrapper">
                    <input id="passwordInput" type="password" autocomplete="off" placeholder="パスワード">
                    <button class="toggle-pw-btn" id="togglePassword" type="button" data-target="passwordInput" aria-pressed="false">表示</button>
                </div>
            </div>
            <div class="auth-btns"><button id="loginButton">ログイン</button></div>
            <p class="muted auth-msg" id="loginMessage" role="status"></p>
        </section>
        <section class="card hidden" id="passwordChangePanel">
            <h1 class="auth-title">パスワードの設定</h1>
            <p class="auth-sub" id="pwChangeWho"></p>
            <div class="auth-form">
                <div class="password-wrapper">
                    <input id="newPassword" type="password" autocomplete="off" placeholder="新しいパスワード">
                    <button class="toggle-pw-btn" type="button" data-target="newPassword" aria-pressed="false">表示</button>
                </div>
                <div class="password-wrapper">
                    <input id="newPasswordConfirm" type="password" autocomplete="off" placeholder="新しいパスワード（確認）">
                    <button class="toggle-pw-btn" type="button" data-target="newPasswordConfirm" aria-pressed="false">表示</button>
                </div>
            </div>
            <div class="auth-btns"><button id="savePassword" type="button">変更してはじめる</button><button class="secondary" id="cancelPassword" type="button">スキップ</button></div>
            <p class="muted auth-msg" id="pwChangeMessage" role="status"></p>
        </section>
        <section class="card hidden" id="selfPwPanel">
            <h1 class="auth-title">パスワードの変更</h1>
            <p class="auth-sub" id="selfPwNote"></p>
            <div class="auth-form">
                <div class="password-wrapper">
                    <input id="curPw" type="password" autocomplete="off" placeholder="今のパスワード">
                    <button class="toggle-pw-btn" type="button" data-target="curPw" aria-pressed="false">表示</button>
                </div>
                <div class="password-wrapper">
                    <input id="selfNewPw" type="password" autocomplete="off" placeholder="新しいパスワード（8文字以上）">
                    <button class="toggle-pw-btn" type="button" data-target="selfNewPw" aria-pressed="false">表示</button>
                </div>
                <div class="password-wrapper">
                    <input id="selfNewPwConfirm" type="password" autocomplete="off" placeholder="新しいパスワード（確認）">
                    <button class="toggle-pw-btn" type="button" data-target="selfNewPwConfirm" aria-pressed="false">表示</button>
                </div>
            </div>
            <div class="auth-btns"><button id="saveSelfPw" type="button">変更する</button><button class="secondary" id="cancelSelfPw" type="button">戻る</button></div>
            <p class="muted auth-msg" id="selfPwMessage" role="status"></p>
        </section>
        <section class="card hidden" id="appChooser">
            <h1 class="auth-title">どれを使いますか？</h1>
            <p class="auth-sub" id="appChooserWho"></p>
            <div class="auth-form" id="appList"></div>
            <div class="auth-btns"><button class="secondary" type="button" id="openSelfPw">パスワードを変更する</button><button class="danger" type="button" id="appChooserLogout">ログアウト</button></div>
        </section>
        <div id="appDialog" class="app-dialog hidden" role="presentation">
            <section class="app-dialog-card" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle" aria-describedby="appDialogMessage">
                <h2 id="appDialogTitle">確認</h2>
                <p id="appDialogMessage"></p>
                <div class="actions">
                    <button class="secondary hidden" id="appDialogCancel" type="button">キャンセル</button>
                    <button id="appDialogOk" type="button">OK</button>
                </div>
            </section>
        </div>
        <div id="loadingOverlay" class="loading-overlay hidden" role="status" aria-live="polite">
            <div class="loading-card"><div class="loading-spinner"></div><div class="loading-text" id="loadingText">読み込み中…</div></div>
        </div>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="./firebase-config.js"></script>
    <script src="./apps.js"></script>
    <script src="./shared/common.js"></script>
    <script>
        let activeAccount = null;
        let pendingMatch = null;
        let restoringLogin = false;
        let loginPromptShown = false;
        let signingIn = false;

        const ID_DOMAIN = 'quiz.example.com';   // 管理画面（Code.gs）の ID_DOMAIN と同じ値にすること
        const toEmail = (userId) => `${userId.trim().toLowerCase()}@${ID_DOMAIN}`;

        function hideViews() {
            ['loginPanel', 'passwordChangePanel', 'selfPwPanel', 'appChooser'].forEach((id) => $(id).classList.add('hidden'));
        }

        function showLogin() {
            hideViews();
            $('loginPanel').classList.remove('hidden');
            $('passwordInput').value = '';
            $('userIdInput').value = '';
            pendingMatch = null;
            $('newPassword').value = '';
            $('newPasswordConfirm').value = '';
            $('pwChangeMessage').textContent = '';
            if (auth) auth.signOut().catch(() => {});
            clearCachedAccount();
            activeAccount = null;
        }

        function loginErrorMessage(error) {
            const code = (error && error.code) || '';
            if (code === 'auth/too-many-requests') return '失敗が続いたため一時的にロックされました。しばらくしてからやり直してください。';
            if (code === 'auth/network-request-failed') return 'ネットワークに接続できません。';
            if (code.startsWith('auth/')) return 'ユーザーIDまたはパスワードが違います。';
            if (code === 'permission-denied' || code === 'unavailable' || code === 'failed-precondition') {
                return 'ログインはできましたが、データを読み込めませんでした。（コード: ' + code + '）先生に伝えてください。';
            }
            return 'ログインできませんでした。時間をおいてやり直すか、先生に連絡してください。（コード: ' + (code || (error && error.message) || '不明') + '）';
        }

        document.querySelectorAll('.toggle-pw-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                const input = $(btn.dataset.target);
                const isVisible = input.type === 'text';
                input.type = isVisible ? 'password' : 'text';
                btn.textContent = isVisible ? '表示' : '非表示';
                btn.setAttribute('aria-pressed', String(!isVisible));
            });
        });
        ['userIdInput', 'passwordInput'].forEach((id) => {
            $(id).addEventListener('keydown', (event) => {
                if (event.key === 'Enter') $('loginButton').click();
            });
        });

        $('loginButton').onclick = async () => {
            $('loginMessage').textContent = '';
            const userId = $('userIdInput').value.trim();
            const password = $('passwordInput').value;
            if (!auth) return;
            await persistenceReady;
            if (!userId || !password) {
                $('loginMessage').textContent = 'ユーザーIDとパスワードを入力してください。';
                return;
            }
            $('loginButton').disabled = true;
            signingIn = true;
            showLoading('ログインしています…');
            try {
                const { user } = await auth.signInWithEmailAndPassword(toEmail(userId), password);
                const snap = await db.collection('users').doc(user.uid).get();
                if (!snap.exists) {
                    await auth.signOut();
                    $('loginMessage').textContent = 'アカウント情報が見つかりません。先生に連絡してください。';
                    return;
                }
                const profile = snap.data();
                if (profile.mustChange) {
                    pendingMatch = { user, profile, password };
                    hideViews();
                    $('passwordChangePanel').classList.remove('hidden');
                    $('pwChangeWho').textContent = nameLabel(profile);
                    ['newPassword', 'newPasswordConfirm'].forEach((id) => { $(id).type = 'password'; });
                    document.querySelectorAll('#passwordChangePanel .toggle-pw-btn').forEach((b) => { b.textContent = '表示'; b.setAttribute('aria-pressed', 'false'); });
                    $('newPassword').focus();
                    return;
                }
                await completeLogin(profile, user, { askSave: true });
            } catch (error) {
                console.error('login failed', error);
                $('loginMessage').textContent = loginErrorMessage(error);
            } finally {
                signingIn = false;
                hideLoading();
                $('loginButton').disabled = false;
            }
        };

        $('savePassword').onclick = async () => {
            const m = pendingMatch;
            if (!m) return;
            const msg = $('pwChangeMessage');
            const a = $('newPassword').value;
            if (a.length < 8) { msg.textContent = 'パスワードは8文字以上にしてください。'; return; }
            if (a === m.password) { msg.textContent = '初期パスワードとは別のパスワードにしてください。'; return; }
            if (a !== $('newPasswordConfirm').value) { msg.textContent = '確認用のパスワードが一致しません。'; return; }
            $('savePassword').disabled = true;
            showLoading('パスワードを変更しています…');
            try {
                await db.collection('users').doc(m.user.uid).update({ mustChange: false, pwChangedAt: firebase.firestore.FieldValue.serverTimestamp() });
                m.profile.pwChangedAt = Date.now();
                await m.user.updatePassword(a);
            } catch {
                msg.textContent = 'パスワードを変更できませんでした。もう一度ログインしてやり直してください。';
                return;
            } finally {
                hideLoading();
                $('savePassword').disabled = false;
            }
            pendingMatch = null;
            $('newPassword').value = '';
            $('newPasswordConfirm').value = '';
            msg.textContent = '';
            await completeLogin(m.profile, m.user, { askSave: true });
        };
        $('cancelPassword').onclick = async () => {
            const m = pendingMatch;
            if (!m) return;
            const ok = await showConfirm(
                '初期パスワードのまま使用すると、他の人にパスワードを知られた場合にアカウントを使われる可能性があります。\n\nそれでも初期パスワードのまま続けますか？',
                'パスワード設定をスキップ'
            );
            if (!ok) { $('newPassword').focus(); return; }
            showLoading('設定しています…');
            try {
                await db.collection('users').doc(m.user.uid).update({ mustChange: false });
                pendingMatch = null;
                $('newPassword').value = '';
                $('newPasswordConfirm').value = '';
                $('pwChangeMessage').textContent = '';
                await completeLogin(m.profile, m.user, { askSave: true });
            } catch (e) {
                await showAlert('初回設定の完了に失敗しました。もう一度お試しください。', 'ログインできません');
            } finally { hideLoading(); }
        };

        async function completeLogin(profile, user, options = {}) {
            activeAccount = accountFrom(profile, user);
            cacheAccount(user.uid, activeAccount);
            if (options.askSave && !restoringLogin && !loginPromptShown) {
                loginPromptShown = true;
                const save = await showConfirm('次回からこの端末で自動的にログインした状態にしますか？\n\n「保存する」を選ぶと、ブラウザを閉じたあともログインしたままになります。「保存しない」の場合は、このタブを閉じるまでです。', 'ログイン情報の保存', { cancelText: '保存しない', okText: '保存する' });
                try {
                    localStorage.setItem(PERSIST_KEY, save ? 'local' : 'none');
                    await auth.setPersistence(save ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
                } catch (e) {
                    if (save) {
                        localStorage.setItem(PERSIST_KEY, 'none');
                        await showAlert('ログイン情報の保存に失敗しました。次回のページ更新時には再ログインが必要になる場合があります。', '保存できませんでした');
                    }
                }
                loginPromptShown = false;
            }
            $('passwordInput').value = '';
            showAppChooser();
        }

        // すでにログインしている人（保存済み／別のアプリから戻ってきた人）は、ログイン画面を出さずに、そのままアプリの選択へ
        async function restoreSavedLogin(user) {
            if (!user || restoringLogin || activeAccount) return;
            restoringLogin = true;
            try {
                let profile = cachedAccount(user.uid);   // このタブで一度読んでいれば、それを使う
                if (!profile) {
                    const snap = await db.collection('users').doc(user.uid).get();
                    if (!snap.exists || snap.data().mustChange) {
                        localStorage.setItem(PERSIST_KEY, 'none');
                        await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(() => {});
                        await auth.signOut().catch(() => {});
                        return;
                    }
                    profile = snap.data();
                }
                await completeLogin(profile, user, { askSave: false });
            } catch (e) {
                await auth.signOut().catch(() => {});
                showLogin();
            } finally {
                restoringLogin = false;
            }
        }

        // ログイン後、どのアプリを使うか選ぶ（アプリの一覧は apps.js）
        $('appList').innerHTML = (window.APPS || []).map((app) => `<button type="button" data-app="${escapeHtml(app.id)}" data-path="${escapeHtml(app.path)}">${escapeHtml(app.name)}</button>`).join('');
        $('appList').addEventListener('click', (event) => {
            const b = event.target.closest('button[data-app]');
            if (!b) return;
            showLoading(`${b.textContent}を開いています…`, true);
            location.href = b.dataset.path;
        });
        function showAppChooser() {
            hideViews();
            $('appChooser').classList.remove('hidden');
            $('appChooserWho').textContent = nameLabel(activeAccount);
        }
        $('appChooserLogout').onclick = showLogin;

        // ---- パスワードの変更（変更後は1週間は変えられない） ----
        function showSelfPw() {
            hideViews();
            $('selfPwPanel').classList.remove('hidden');
            ['curPw', 'selfNewPw', 'selfNewPwConfirm'].forEach((id) => { $(id).value = ''; $(id).type = 'password'; });
            document.querySelectorAll('#selfPwPanel .toggle-pw-btn').forEach((b) => { b.textContent = '表示'; b.setAttribute('aria-pressed', 'false'); });
            $('selfPwMessage').textContent = '';
            const next = (activeAccount.pwChangedAt || 0) + WEEK_MS;
            const locked = activeAccount.pwChangedAt && next > Date.now();
            $('selfPwNote').textContent = locked
                ? `パスワードは、変更から1週間は変えられません。${new Date(next).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}以降に変更できます。`
                : 'パスワードを変更すると、そこから1週間は再び変更できません。';
            $('saveSelfPw').disabled = Boolean(locked);
        }
        $('openSelfPw').onclick = showSelfPw;
        $('cancelSelfPw').onclick = showAppChooser;
        $('saveSelfPw').onclick = async () => {
            const msg = $('selfPwMessage'), cur = $('curPw').value, a = $('selfNewPw').value;
            if (!cur || !a) { msg.textContent = '今のパスワードと新しいパスワードを入力してください。'; return; }
            if (a.length < 8) { msg.textContent = 'パスワードは8文字以上にしてください。'; return; }
            if (a === cur) { msg.textContent = '今のパスワードとは別のパスワードにしてください。'; return; }
            if (a.toLowerCase() === String(activeAccount.userId || '').toLowerCase()) { msg.textContent = 'ユーザーIDと同じ文字列は使えません。'; return; }
            if (a !== $('selfNewPwConfirm').value) { msg.textContent = '確認用のパスワードが一致しません。'; return; }
            if (!await showConfirm('パスワードを変更します。変更後の1週間は、もう一度変更することはできません。よろしいですか？', 'パスワードの変更')) return;
            $('saveSelfPw').disabled = true;
            showLoading('パスワードを変更しています…');
            try {
                const user = auth.currentUser;
                try { await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email, cur)); }
                catch { msg.textContent = '今のパスワードが違います。'; $('saveSelfPw').disabled = false; return; }
                try { await db.collection('users').doc(user.uid).update({ mustChange: false, pwChangedAt: firebase.firestore.FieldValue.serverTimestamp() }); }
                catch { msg.textContent = '変更できませんでした。前回の変更から1週間たっていない可能性があります。'; return; }
                activeAccount.pwChangedAt = Date.now();
                cacheAccount(user.uid, activeAccount);
                try { await user.updatePassword(a); }
                catch { msg.textContent = 'パスワードを変更できませんでした。先生に連絡してください。'; return; }
            } finally {
                hideLoading();
            }
            await showAlert('パスワードを変更しました。1週間は、もう一度変更できません。', '変更しました');
            showAppChooser();
        };

        disableAutocomplete();
        if (!startFirebase()) {
            $('loginButton').disabled = true;
            $('loginMessage').textContent = 'firebase-config.js に Firebase の設定を入力してください。';
        } else {
            if (location.hash === '#menu') history.replaceState(null, '', location.pathname + location.search);   // アプリからの戻りリンク
            // Firebase が保存済みのログイン状態を確認するまでログイン画面を出さず、更新時のちらつきを防ぐ。
            showLoading('ログイン状態を確認しています…');
            hideViews();
            auth.onAuthStateChanged(async (user) => {
                await persistenceReady;
                if (user && !activeAccount && !signingIn) {
                    await restoreSavedLogin(user);
                } else if (!user && !activeAccount && !signingIn) {
                    showLogin();
                }
                hideLoading();
            });
        }
    </script>
</body>

</html>
