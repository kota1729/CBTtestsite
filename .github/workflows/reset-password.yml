name: パスワードのリセット
on:
  workflow_dispatch:
    inputs:
      userId:
        description: 'リセットするユーザーID（例：1-KANKYO-05）'
        required: true
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix tools
      - run: node tools/reset-password.js "$USER_ID"
        env:
          USER_ID: ${{ inputs.userId }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
