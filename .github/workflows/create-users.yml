name: アカウントの一括登録
on:
  workflow_dispatch:
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix tools
      - name: CSVを一時ファイルに書き出す（この実行が終わると消えます）
        run: printf '%s' "$ACCOUNTS_CSV" > accounts.csv
        env:
          ACCOUNTS_CSV: ${{ secrets.ACCOUNTS_CSV }}
      - run: node tools/create-users.js accounts.csv
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
